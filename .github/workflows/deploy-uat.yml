name: Deploy to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image (UAT)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64   # ponytail: match UAT server arch
          tags: rajathhebbark/recruitment-fe:uat
          build-args: |
            VITE_API_BASE_URL=${{ secrets.UAT_VITE_API_BASE_URL }}
            VITE_PUBLIC_API_URL=${{ secrets.UAT_VITE_PUBLIC_API_URL }}
          cache-from: type=gha,scope=uat
          cache-to: type=gha,mode=max,scope=uat

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.UAT_HOST }}
          username: ${{ secrets.UAT_USERNAME }}
          key: ${{ secrets.UAT_SSH_KEY }}
          script: |
            set -e
            cd /opt/rec_fe_uat
            docker compose pull
            docker compose up -d --remove-orphans --force-recreate
            docker image prune -f
