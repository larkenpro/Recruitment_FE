name: Deploy to UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: [self-hosted, uat]   # runner lives on the UAT server

    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        env:
          VITE_API_BASE_URL: ${{ secrets.UAT_VITE_API_BASE_URL }}
          VITE_PUBLIC_API_URL: ${{ secrets.UAT_VITE_PUBLIC_API_URL }}
        run: |
          docker build -t rajathhebbark/recruitment-fe:uat \
            --build-arg VITE_API_BASE_URL --build-arg VITE_PUBLIC_API_URL .
          docker compose -f docker-compose.uat.yml up -d --remove-orphans --force-recreate
          docker image prune -f
